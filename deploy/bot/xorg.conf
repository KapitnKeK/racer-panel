# Xorg ohne Monitor auf einer NVIDIA-Rechenkarte (getestet: Tesla P100, Treiber 580).
# BusID anpassen: nvidia-smi --query-gpu=pci.bus_id --format=csv,noheader  (00000000:08:00.0 -> PCI:8:0:0)
Section "ServerLayout"
    Identifier "Layout0"
    Screen 0 "Screen0"
EndSection
Section "ServerFlags"
    Option "AutoAddDevices" "False"
    Option "DontVTSwitch" "True"
EndSection
Section "Device"
    Identifier "Device0"
    Driver "nvidia"
    BusID "PCI:8:0:0"
    Option "AllowEmptyInitialConfiguration" "True"
    Option "UseDisplayDevice" "None"
EndSection
Section "Screen"
    Identifier "Screen0"
    Device "Device0"
    DefaultDepth 24
    Option "AllowEmptyInitialConfiguration" "True"
    SubSection "Display"
        Depth 24
        Virtual 1920 1080
    EndSubSection
EndSection
